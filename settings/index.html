<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ayarlar – LSPD Tools</title>
  <link rel="icon" href="../img/lspd.webp" type="image/webp">
  <script src="../assets/prefs.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/theme.css">
  <script src="../assets/character-switcher.js" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <a class="brand" href="../">
        <img src="../img/lspd.webp" alt="LSPD" width="46" height="44">
        <span>LSPD Tools</span>
      </a>
      <div class="char-switcher" data-settings-url="./"></div>
    </div>
  </header>

  <img class="watermark" src="../img/lspd.webp" alt="" aria-hidden="true">

  <main>
    <h1 class="page-title">Ayarlar</h1>
    <p class="intro">Tercihlerin yalnızca bu tarayıcının çerezlerinde saklanır; hiçbir yere gönderilmez.</p>

    <!-- Appearance -->
    <section class="panel" aria-labelledby="appearance-title">
      <h2 id="appearance-title">Görünüm</h2>
      <p class="panel-desc">Araçların koyu ya da açık temada görünmesini seç.</p>
      <div class="segmented" role="group" aria-label="Tema">
        <button type="button" data-theme-choice="dark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          Koyu
        </button>
        <button type="button" data-theme-choice="light">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          Açık
        </button>
      </div>
    </section>

    <!-- Personnel -->
    <section class="panel" aria-labelledby="personnel-title">
      <h2 id="personnel-title">Personel Bilgisi Tanımla</h2>
      <p class="panel-desc">En fazla iki karakter tanımlayabilirsin. Sağ üstten seçtiğin karakterin bilgileri kullanılır.</p>

      <form id="personnel-form" autocomplete="off"></form>

      <template id="char-template">
        <div class="char-block" data-index="{i}">
          <div class="char-block-head">
            <h3>{title}</h3>
            <span class="badge-active">Aktif</span>
            <button type="button" class="btn-link" data-clear>Temizle</button>
          </div>
          <div class="field-grid">
        <div class="field">
          <label for="p{i}-name">Ad Soyadı</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input class="input" id="p{i}-name" name="name{i}" type="text" placeholder="Ad Soyadı" maxlength="60">
          </div>
        </div>

        <div class="field">
          <label id="p{i}-rank-label">Rütbe</label>
          <div class="select input-wrap" data-name="rank" data-placeholder="Rütbe Seçin"
               data-options="Officer|Detective|Sergeant|Lieutenant|Captain">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
          </div>
        </div>

        <div class="field">
          <label for="p{i}-badge">Seri No.</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M15 8h2"/><path d="M15 12h2"/><path d="M7 16h10"/></svg>
            <input class="input" id="p{i}-badge" name="badge{i}" type="text" inputmode="numeric" placeholder="Seri No." maxlength="12">
          </div>
        </div>

        <div class="field">
          <label id="p{i}-division-label">Division</label>
          <div class="select input-wrap" data-name="division" data-placeholder="Division Seçin"
               data-options="MISN|MISN B|CTD|METRO|ASD|VES">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 13a3 3 0 1 0-6 0"/><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/><circle cx="12" cy="8" r="2"/></svg>
          </div>
        </div>
          </div>
        </div>
      </template>

      <div class="actions">
        <button type="button" class="btn btn-primary" id="save-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>
          Kaydet
        </button>
        <button type="button" class="btn btn-danger" id="clear-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
          Tümünü Temizle
        </button>
        <span class="status" id="status" role="status" aria-live="polite"></span>
      </div>
    </section>
  </main>

  <script>
  (function () {
    var CHECK = '<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
    var CHEVRON = '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';

    /* ---------- Theme ---------- */
    var themeButtons = document.querySelectorAll('[data-theme-choice]');
    function markTheme() {
      var current = LSPDPrefs.getTheme();
      themeButtons.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.themeChoice === current)); });
    }
    themeButtons.forEach(function (b) {
      b.addEventListener('click', function () { LSPDPrefs.setTheme(b.dataset.themeChoice); markTheme(); });
    });
    markTheme();

    /* ---------- Character blocks (Ana Karakter / Alt Karakter) ---------- */
    var TITLES = ['Ana Karakter', 'Alt Karakter'];
    var form = document.getElementById('personnel-form');
    var tpl = document.getElementById('char-template').innerHTML;
    TITLES.forEach(function (title, i) {
      form.insertAdjacentHTML('beforeend', tpl.replace(/\{i\}/g, i).replace('{title}', title));
    });

    /* ---------- Custom selects (rounded list, keyboard friendly) ---------- */
    var selects = {};
    document.querySelectorAll('.select').forEach(function (root) {
      var name = root.dataset.name + root.closest('.char-block').dataset.index;
      var options = root.dataset.options.split('|');
      var labelId = root.parentElement.querySelector('label').id;
      var value = '';

      var trigger = document.createElement('button');
      trigger.type = 'button';
      trigger.className = 'select-trigger';
      trigger.setAttribute('aria-haspopup', 'listbox');
      trigger.setAttribute('aria-expanded', 'false');
      trigger.setAttribute('aria-labelledby', labelId);
      var list = document.createElement('ul');
      list.className = 'select-list';
      list.setAttribute('role', 'listbox');
      list.setAttribute('aria-labelledby', labelId);
      options.forEach(function (opt) {
        var li = document.createElement('li');
        li.setAttribute('role', 'option');
        li.dataset.value = opt;
        li.innerHTML = CHECK + '<span></span>';
        li.lastChild.textContent = opt;
        li.addEventListener('mousedown', function (e) { e.preventDefault(); });
        li.addEventListener('click', function () { set(opt); close(); trigger.focus(); });
        list.appendChild(li);
      });
      root.appendChild(trigger);
      root.appendChild(list);

      function render() {
        trigger.innerHTML = (value ? '<span></span>' : '<span class="placeholder"></span>') + CHEVRON;
        trigger.firstChild.textContent = value || root.dataset.placeholder;
        list.querySelectorAll('li').forEach(function (li) { li.setAttribute('aria-selected', String(li.dataset.value === value)); });
      }
      function set(v) { value = options.indexOf(v) >= 0 ? v : ''; render(); }
      var activeIndex = -1;
      function highlight(i) {
        var items = list.querySelectorAll('li');
        items.forEach(function (li) { li.classList.remove('active'); });
        activeIndex = (i + items.length) % items.length;
        items[activeIndex].classList.add('active');
        items[activeIndex].scrollIntoView({ block: 'nearest' });
      }
      function open() {
        document.querySelectorAll('.select.open').forEach(function (o) { if (o !== root) o.classList.remove('open'); });
        root.classList.add('open'); trigger.setAttribute('aria-expanded', 'true');
        highlight(Math.max(0, options.indexOf(value)));
      }
      function close() { root.classList.remove('open'); trigger.setAttribute('aria-expanded', 'false'); }

      trigger.addEventListener('click', function () { root.classList.contains('open') ? close() : open(); });
      trigger.addEventListener('keydown', function (e) {
        var isOpen = root.classList.contains('open');
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          if (!isOpen) open(); else highlight(activeIndex + (e.key === 'ArrowDown' ? 1 : -1));
        } else if ((e.key === 'Enter' || e.key === ' ') && isOpen) {
          e.preventDefault(); set(options[activeIndex]); close();
        } else if (e.key === 'Escape') { close(); }
      });
      trigger.addEventListener('blur', close);

      selects[name] = { get: function () { return value; }, set: set };
      render();
    });

    /* ---------- Characters (cookie only) ---------- */
    var statusEl = document.getElementById('status');
    var statusTimer;
    var blocks = form.querySelectorAll('.char-block');
    var activeIndex = 0;

    function field(i, key) { return document.getElementById('p' + i + '-' + key); }
    function fill(i, c) {
      c = c || {};
      field(i, 'name').value = c.name || '';
      field(i, 'badge').value = c.badge || '';
      selects['rank' + i].set(c.rank || '');
      selects['division' + i].set(c.division || '');
    }
    function read(i) {
      return {
        name: field(i, 'name').value.trim(),
        rank: selects['rank' + i].get(),
        badge: field(i, 'badge').value.trim(),
        division: selects['division' + i].get(),
      };
    }
    function markActive() {
      blocks.forEach(function (b, i) { b.classList.toggle('is-active', i === activeIndex); });
    }
    function load() {
      var d = LSPDPrefs.getCharacters();
      activeIndex = d.active;
      TITLES.forEach(function (_, i) { fill(i, d.list[i]); });
      markActive();
    }
    function showStatus(text) {
      statusEl.textContent = text;
      statusEl.classList.add('show');
      clearTimeout(statusTimer);
      statusTimer = setTimeout(function () { statusEl.classList.remove('show'); }, 2500);
    }
    function save() {
      var list = TITLES.map(function (_, i) { return read(i); });
      // Only the main slot may be used on its own: move a lone Alt Karakter up.
      if (!LSPDPrefs.isFilled(list[0]) && LSPDPrefs.isFilled(list[1])) {
        list = [list[1], list[0]];
        activeIndex = 0;
      }
      LSPDPrefs.saveCharacters({ active: activeIndex, list: list });
    }

    document.getElementById('save-btn').addEventListener('click', function () {
      save();
      showStatus('Kaydedildi.');
    });
    blocks.forEach(function (b, i) {
      b.querySelector('[data-clear]').addEventListener('click', function () {
        fill(i, null);
        save();
        showStatus(TITLES[i] + ' temizlendi.');
      });
    });
    document.getElementById('clear-btn').addEventListener('click', function () {
      LSPDPrefs.saveCharacters({ active: 0, list: [] });
      showStatus('Bilgiler temizlendi.');
    });
    form.addEventListener('submit', function (e) { e.preventDefault(); });
    // Switching from the header (or another tab) refreshes the form.
    document.addEventListener('lspd:characters-change', load);

    load();
  })();
  </script>
</body>
</html>
